<script>
(() => {
  const params = new URLSearchParams(location.hash.slice(1));
  let edition = location.hash.slice(1);
  try { edition = edition || sessionStorage.getItem('factorioEdition') || ''; } catch (e) {}
  if (edition !== 'normal' && edition !== 'space') return;
  const activate = () => {
    const tab = document.querySelector('.tab[data-page="' + edition + '"]');
    if (tab) tab.click();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', activate, {once:true});
  else activate();
})();
</script>
