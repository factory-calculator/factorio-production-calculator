<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>研究計画プレビュー | Factorio Production Calculator</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#192330;--panel2:#202d3b;--line:#344456;--text:#edf3f8;--muted:#9aabba;--accent:#e6a23c;--green:#7fc79a;--red:#e58b8b;--blue:#79b8e8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0e141c,#17212c);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:22px max(18px,calc((100% - 1120px)/2));background:#141d28;border-bottom:1px solid var(--line)}
h1{font-size:clamp(22px,4vw,32px);margin:0 0 5px}header p{margin:0;color:var(--muted)}
main{max-width:1120px;margin:22px auto;padding:0 16px 60px;display:grid;gap:16px}
.notice{border:1px solid #a66b28;background:#382b1b;color:#ffe0ae;padding:12px 14px;border-radius:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar label{display:flex;align-items:center;gap:8px;color:var(--muted)}
button,input,select{font:inherit;color:var(--text);background:#101923;border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
button{cursor:pointer;background:#9a641d;border-color:#c68b38;font-weight:650}
button.secondary{background:#263545;border-color:#40546a}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.editions{display:flex;gap:8px;flex-wrap:wrap}.edition[aria-pressed="true"]{background:#9a641d;border-color:#c68b38}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px;color:var(--blue)}
.search{width:100%;margin-bottom:10px}
.tech-list,.selected-list,.completed-list{display:grid;gap:8px}
.tech-row,.selected-row,.completed-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.tech-row>div,.selected-row>div{min-width:0}.tech-row small,.selected-row small{display:block;color:var(--muted)}
.selected-row{align-items:flex-start}.selected-row input{width:88px}
.selected-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.completed-row{justify-content:flex-start}
.muted{color:var(--muted);font-size:13px}.empty{color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:21px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line)}th{color:var(--muted)}
.results{display:grid;gap:16px}.error{color:#ffd1d1;background:#4a2222;border:1px solid #9a4b4b;padding:10px;border-radius:8px}.success{color:#c8f0d2}
@media(max-width:720px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:18px 16px}.panel{padding:13px}.tech-row{align-items:flex-start}.tech-row button{white-space:nowrap}}
</style>
</head>

<header>
  <h1 id="pageTitle">研究計画プレビュー</h1>
  <p id="pageSubtitle">研究対象を選び、前提技術と必要なサイエンスパックを確認できます。</p>
</header>
<main>
  <div class="notice" id="demoNotice">これは画面・操作確認用のデモです。表示される技術名・数値は架空のサンプルで、Factorioの実データではありません。</div>
  <section class="panel toolbar" aria-label="表示設定">
    <div class="editions">
      <button class="edition" type="button" data-edition="base" aria-pressed="true">Base Game</button>
      <button class="edition secondary" type="button" data-edition="spaceage" aria-pressed="false">Space Age</button>
    </div>
    <label><span id="languageLabel">言語</span>
      <select id="language">
        <option value="ja">日本語</option><option value="en">English</option><option value="zh-CN">简体中文</option>
      </select>
    </label>
    <label><span id="facilityLabel">研究施設数</span><input id="facilityCount" type="number" min="1" max="10000" step="1" value="1" inputmode="numeric" style="width:100px"></label>
    <label><span id="speedLabel">研究速度倍率</span><input id="researchSpeed" type="number" min="0.01" max="1000" step="0.1" value="1" inputmode="decimal" style="width:100px"></label>
    <button id="reset" class="secondary" type="button">リセット</button>
  </section>

  <div class="layout">
    <section class="panel">
      <h2 id="availableTitle">技術を検索して追加</h2>
      <input id="search" class="search" type="search" placeholder="技術名で検索" autocomplete="off">
      <div id="technologyList" class="tech-list"></div>
    </section>
    <section class="panel">
      <h2 id="targetsTitle">研究目標</h2>
      <div id="selectedList" class="selected-list"></div>
      <h3 id="completedTitle" style="margin-top:18px">研究済み技術</h3>
      <p class="muted" id="completedHelp">チェックした技術は必要コストから除外します。</p>
      <div id="completedList" class="completed-list"></div>
    </section>
  </div>

  <section class="panel results">
    <div class="toolbar">
      <h2 id="resultTitle" style="margin:0">計算結果</h2>
      <button id="calculate" type="button">研究コストを計算</button>
      <span id="status" class="muted" role="status" aria-live="polite"></span>
    </div>
    <div id="error" aria-live="polite"></div>
    <div id="summary"></div>
    <p class="muted" id="estimateNote">全施設が常時稼働し、研究対象を並行処理する理論値です。</p>
    <div>
      <h3 id="orderTitle">研究順序と必要量</h3>
      <div id="orderTable"></div>
    </div>
    <div>
      <h3 id="packsTitle">サイエンスパック合計</h3>
      <div id="packsTable"></div>
    </div>
    <div>
      <h3 id="conditionsTitle">条件による解放</h3>
      <div id="conditions"></div>
    </div>
  </section>
</main>
<script>
/* Factorio Production Calculator — research planning core
 * Dataset values must be derived from permitted, versioned game data.
 * Technologies tagged category:"combat" or policyExcluded:true are omitted,
 * as are all technologies that depend on an omitted technology.
 */
(function (root) {
  "use strict";

  const VERSION = 1;
  const EDITIONS = new Set(["base", "spaceage"]);

  function parseFormula(source, level) {
    if (typeof source !== "string" || source.length > 200) throw new Error("Invalid research cost formula");
    const tokens = source.match(/\s*(?:\d+(?:\.\d+)?|L|[()+*/^\-])/g)?.map(token => token.trim());
    if (!tokens || tokens.join("").replace(/\s/g, "") !== source.replace(/\s/g, "")) {
      throw new Error("Unsupported token in research cost formula");
    }
    let i = 0;
    const peek = () => tokens[i] || "";
    const take = () => tokens[i++];
    function primary() {
      const t = take();
      if (t === "(") {
        const v = expression();
        if (take() !== ")") throw new Error("Unclosed formula parenthesis");
        return v;
      }
      if (t === "L") return level;
      if (t === "+") return primary();
      if (t === "-") return -primary();
      const n = Number(t);
      if (!Number.isFinite(n)) throw new Error("Invalid formula value");
      return n;
    }
    function power() {
      let v = primary();
      if (peek() === "^") { take(); v = Math.pow(v, power()); }
      return v;
    }
    function term() {
      let v = power();
      while (peek() === "*" || peek() === "/") {
        const op = take(), rhs = power();
        v = op === "*" ? v * rhs : v / rhs;
      }
      return v;
    }
    function expression() {
      let v = term();
      while (peek() === "+" || peek() === "-") {
        const op = take(), rhs = term();
        v = op === "+" ? v + rhs : v - rhs;
      }
      return v;
    }
    const value = expression();
    if (i !== tokens.length || !Number.isFinite(value) || value < 0) {
      throw new Error("Research cost formula produced an invalid value");
    }
    return Math.ceil(value);
  }

  function normalizeDataset(input, expectedEdition) {
    if (!input || input.schemaVersion !== VERSION || !EDITIONS.has(input.edition)) {
      throw new Error("Unsupported research dataset");
    }
    if (expectedEdition && input.edition !== expectedEdition) {
      throw new Error("Research dataset edition mismatch");
    }
    if (!Array.isArray(input.technologies)) throw new Error("Technology list is missing");
    const all = new Map();
    for (const tech of input.technologies) {
      if (!tech || typeof tech.id !== "string" || !tech.id || all.has(tech.id)) {
        throw new Error("Technology IDs must be unique non-empty strings");
      }
      all.set(tech.id, tech);
    }

    const blocked = new Set();
    for (const tech of all.values()) {
      const prerequisites = tech.prerequisites == null ? [] : tech.prerequisites;
      if (!Array.isArray(prerequisites)) throw new Error("Prerequisites must be an array for " + tech.id);
      if (tech.policyExcluded === true || tech.category === "combat" || tech.hidden === true || tech.enabled === false) {
        blocked.add(tech.id);
      }
    }
    let changed = true;
    while (changed) {
      changed = false;
      for (const tech of all.values()) {
        if (blocked.has(tech.id)) continue;
        if ((tech.prerequisites || []).some(id => blocked.has(id))) {
          blocked.add(tech.id);
          changed = true;
        }
      }
    }

    const available = new Map();
    for (const [id, tech] of all) {
      if (blocked.has(id)) continue;
      const prereqs = Array.isArray(tech.prerequisites) ? tech.prerequisites : [];
      if (prereqs.some(p => !all.has(p))) throw new Error("Unknown prerequisite for " + id);
      available.set(id, tech);
    }
    return { edition: input.edition, technologies: available, excludedCount: blocked.size };
  }

  function plan(input, request) {
    if (!request || !Array.isArray(request.targets) || request.targets.length === 0) {
      throw new Error("Select at least one target technology");
    }
    const dataset = normalizeDataset(input, request.edition);
    const researchFacilityCount = request.researchFacilityCount == null ? 1 : Number(request.researchFacilityCount);
    const researchSpeedMultiplier = request.researchSpeedMultiplier == null ? 1 : Number(request.researchSpeedMultiplier);
    if (!Number.isInteger(researchFacilityCount) || researchFacilityCount < 1 || researchFacilityCount > 10000) {
      throw new Error("Research facility count must be an integer from 1 to 10000");
    }
    if (!Number.isFinite(researchSpeedMultiplier) || researchSpeedMultiplier < 0.01 || researchSpeedMultiplier > 1000) {
      throw new Error("Research speed multiplier must be from 0.01 to 1000");
    }
    const completed = new Set(Array.isArray(request.completed) ? request.completed : []);
    const currentLevels = request.currentLevels == null ? {} : request.currentLevels;
    if (!currentLevels || typeof currentLevels !== "object" || Array.isArray(currentLevels)) {
      throw new Error("Current research levels must be an object");
    }
    for (const [id, rawLevel] of Object.entries(currentLevels)) {
      const tech = dataset.technologies.get(id);
      const level = Number(rawLevel);
      if (!tech || !Number.isInteger(level) || level < 0 || level > 100000) {
        throw new Error("Invalid current research level for " + id);
      }
      const max = tech.maxLevel === "infinite" ? Infinity : Number(tech.maxLevel || 1);
      if (level > max) throw new Error("Current research level exceeds the technology maximum for " + id);
    }
    const requested = new Map();
    for (const target of request.targets) {
      if (!target || typeof target.id !== "string") throw new Error("Invalid research target");
      const tech = dataset.technologies.get(target.id);
      if (!tech) throw new Error("Technology is unavailable in this edition or excluded");
      const level = target.level == null ? 1 : Number(target.level);
      if (!Number.isInteger(level) || level < 1 || level > 100000) throw new Error("Invalid target level");
      const max = tech.maxLevel === "infinite" ? Infinity : Number(tech.maxLevel || 1);
      if (level > max) throw new Error("Target level exceeds the technology maximum");
      requested.set(target.id, Math.max(requested.get(target.id) || 0, level));
    }

    const ordered = [], visiting = new Set(), visited = new Set(), neededLevels = new Map();
    function visit(id, targetLevel) {
      if (completed.has(id)) return;
      const tech = dataset.technologies.get(id);
      if (!tech) throw new Error("A prerequisite is unavailable or excluded");
      neededLevels.set(id, Math.max(neededLevels.get(id) || 0, targetLevel));
      if (visited.has(id)) return;
      if (visiting.has(id)) throw new Error("Circular technology prerequisites detected");
      visiting.add(id);
      for (const prereq of tech.prerequisites || []) visit(prereq, 1);
      visiting.delete(id);
      visited.add(id);
      ordered.push(id);
    }
    for (const [id, level] of requested) visit(id, level);

    const packs = Object.create(null), rows = [], conditions = [];
    let totalResearchSeconds = 0, totalUnits = 0;
    for (const id of ordered) {
      const tech = dataset.technologies.get(id);
      if (tech.researchType === "condition" || tech.researchTrigger) {
        conditions.push({ id, trigger: tech.researchTrigger || null, condition: tech.condition || null });
        rows.push({ id, kind: "condition", levels: 0, units: 0, seconds: 0 });
        continue;
      }
      const from = Number(currentLevels[id] || 0);
      const to = neededLevels.get(id) || 1;
      if (from >= to) continue;
      const time = Number(tech.timeSeconds);
      if (!Number.isFinite(time) || time <= 0) throw new Error("Invalid research time for " + id);
      let units = 0;
      for (let level = from + 1; level <= to; level++) {
        const count = tech.countFormula != null
          ? parseFormula(tech.countFormula, level)
          : Number(tech.unitCount);
        if (!Number.isFinite(count) || count < 0) throw new Error("Invalid unit count for " + id);
        units += Math.ceil(count);
      }
      if (tech.sciencePacks != null && !Array.isArray(tech.sciencePacks)) {
        throw new Error("Science packs must be an array for " + id);
      }
      for (const pack of (tech.sciencePacks || [])) {
        if (!pack || typeof pack.id !== "string" || !Number.isFinite(Number(pack.amountPerUnit)) || Number(pack.amountPerUnit) < 0) {
          throw new Error("Invalid science pack entry for " + id);
        }
        packs[pack.id] = (packs[pack.id] || 0) + units * Number(pack.amountPerUnit);
      }
      const seconds = units * time;
      totalUnits += units;
      totalResearchSeconds += seconds;
      rows.push({ id, kind: "science", levels: to - from, units, seconds });
    }
    return {
      edition: dataset.edition,
      technologies: rows,
      sciencePacks: packs,
      totalUnits,
      totalResearchSeconds,
      totalResearchHours: totalResearchSeconds / 3600,
      researchFacilityCount,
      researchSpeedMultiplier,
      estimatedResearchSeconds: totalResearchSeconds / (researchFacilityCount * researchSpeedMultiplier),
      estimatedResearchHours: totalResearchSeconds / (researchFacilityCount * researchSpeedMultiplier * 3600),
      conditions,
      excludedTechnologyCount: dataset.excludedCount
    };
  }

  const api = Object.freeze({ version: VERSION, parseFormula, normalizeDataset, plan });
  root.FactorioResearchPlanner = api;
  if (typeof module !== "undefined" && module.exports) module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>

let edition="base",language="ja",targets=new Map(),completed=new Set();
const t=key=>copy[language][key]||key;
const techs=()=>datasets[edition].technologies;
const label=tech=>tech.name[language]||tech.name.en||tech.id;
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;};
function renderStatic(){document.documentElement.lang=language;$("pageTitle").textContent=t("title");$("pageSubtitle").textContent=t("subtitle");$("demoNotice").textContent=t("demo");$("languageLabel").textContent=t("language");$("availableTitle").textContent=t("available");$("search").placeholder=t("search");$("targetsTitle").textContent=t("targets");$("completedTitle").textContent=t("completed");$("completedHelp").textContent=t("completedHelp");$("calculate").textContent=t("calculate");$("reset").textContent=t("reset");$("resultTitle").textContent=t("result");$("orderTitle").textContent=t("order");$("packsTitle").textContent=t("packs");$("conditionsTitle").textContent=t("conditions");$("facilityLabel").textContent=t("facilities");$("speedLabel").textContent=t("speed");$("estimateNote").textContent=t("estimateNote");document.querySelectorAll(".edition").forEach(b=>{b.textContent=t(b.dataset.edition);b.setAttribute("aria-pressed",String(b.dataset.edition===edition));b.classList.toggle("secondary",b.dataset.edition!==edition);});}
function renderList(){const q=$("search").value.trim().toLocaleLowerCase();const list=$("technologyList");list.replaceChildren();const matches=techs().filter(x=>label(x).toLocaleLowerCase().includes(q)||x.id.includes(q));if(!matches.length){list.append(el("div","empty",t("noMatch")));return;}for(const tech of matches){const row=el("div","tech-row");const info=el("div");info.append(el("strong","",label(tech)),el("small","",tech.maxLevel==="infinite"?"∞":(tech.maxLevel||1)===1?"1":String(tech.maxLevel)));const button=el("button",targets.has(tech.id)?"secondary":"",targets.has(tech.id)?t("added"):t("add"));button.type="button";button.disabled=targets.has(tech.id);button.addEventListener("click",()=>{targets.set(tech.id,{level:1,currentLevel:0});renderAll();});row.append(info,button);list.append(row);}}
function renderSelected(){const list=$("selectedList");list.replaceChildren();if(!targets.size)list.append(el("div","empty",t("empty")));for(const [id,target] of targets){const tech=techs().find(x=>x.id===id);if(!tech)continue;const row=el("div","selected-row"),info=el("div");info.append(el("strong","",label(tech)));const controls=el("div","selected-controls");if(tech.maxLevel==="infinite"){const current=el("input");current.type="number";current.min="0";current.max="100000";current.value=target.currentLevel||0;current.setAttribute("aria-label",t("currentLevel"));current.addEventListener("change",()=>{target.currentLevel=Number(current.value);});const level=el("input");level.type="number";level.min="1";level.max="100000";level.value=target.level;level.setAttribute("aria-label",t("level"));level.addEventListener("change",()=>{target.level=Number(level.value);});controls.append(el("span","muted",t("currentLevel")),current,el("span","muted",t("level")),level);}const remove=el("button","secondary",t("remove"));remove.type="button";remove.addEventListener("click",()=>{targets.delete(id);renderAll();});controls.append(remove);row.append(info,controls);list.append(row);}}
function renderCompleted(){const list=$("completedList");list.replaceChildren();for(const tech of techs()){const row=el("label","completed-row"),cb=el("input");cb.type="checkbox";cb.checked=completed.has(tech.id);cb.addEventListener("change",()=>{cb.checked?completed.add(tech.id):completed.delete(tech.id);});row.append(cb,el("span","",label(tech)));list.append(row);}}
function table(headers,rows){const tbl=el("table"),thead=el("thead"),tr=el("tr");headers.forEach(h=>tr.append(el("th","",h)));thead.append(tr);tbl.append(thead);const body=el("tbody");rows.forEach(values=>{const row=el("tr");values.forEach(v=>row.append(el("td","",String(v))));body.append(row);});tbl.append(body);return tbl;}
function calculate(){const error=$("error");error.replaceChildren();$("summary").replaceChildren();$("orderTable").replaceChildren();$("packsTable").replaceChildren();$("conditions").replaceChildren();if(!targets.size){error.append(el("div","error",t("selectOne")));return;}try{const result=FactorioResearchPlanner.plan(datasets[edition],{edition,targets:[...targets].map(([id,x])=>({id,level:x.level})),completed:[...completed],currentLevels:Object.fromEntries([...targets].map(([id,x])=>[id,x.currentLevel||0])),researchFacilityCount:Number($("facilityCount").value),researchSpeedMultiplier:Number($("researchSpeed").value)});const stats=el("div","stats");[[t("units"),result.totalUnits],[t("hours"),result.totalResearchHours.toFixed(2)+" h"],[t("estimated"),result.estimatedResearchHours.toFixed(2)+" h"],[t("excluded"),result.excludedTechnologyCount]].forEach(([name,value])=>{const box=el("div","stat");box.append(el("small","",name),el("strong","",String(value)));stats.append(box);});$("summary").append(stats);
const orderRows=result.technologies.map(row=>{const tech=techs().find(x=>x.id===row.id);return [tech?label(tech):row.id,row.kind==="condition"?t("kindCondition"):t("kindScience"),row.units,row.seconds?row.seconds+" s":"—"];});$("orderTable").append(orderRows.length?table([t("name"),t("type"),t("count"),t("time")],orderRows):el("div","empty",t("none")));
const packRows=Object.entries(result.sciencePacks).map(([id,amount])=>[packNames[id]?.[language]||id,amount]);$("packsTable").append(packRows.length?table([t("pack"),t("count")],packRows):el("div","empty",t("none")));
const condRows=result.conditions.map(c=>{const tech=techs().find(x=>x.id===c.id);const desc=c.trigger?.description?.[language]||c.trigger?.description?.en||t("none");return [tech?label(tech):c.id,desc];});$("conditions").append(condRows.length?table([t("name"),t("trigger")],condRows):el("div","empty",t("none")));$("estimateNote").textContent=t("estimateNote");$("status").textContent=t("ready");}catch(e){error.append(el("div","error",t("error")+": "+e.message));}}
function renderAll(){renderStatic();renderList();renderSelected();renderCompleted();$("status").textContent="";$("error").replaceChildren();$("summary").replaceChildren();$("orderTable").replaceChildren();$("packsTable").replaceChildren();$("conditions").replaceChildren();}
document.querySelectorAll(".edition").forEach(b=>b.addEventListener("click",()=>{edition=b.dataset.edition;targets.clear();completed.clear();$("search").value="";renderAll();}));
$("language").addEventListener("change",e=>{language=e.target.value;renderAll();});
$("search").addEventListener("input",renderList);
$("calculate").addEventListener("click",calculate);
$("reset").addEventListener("click",()=>{targets.clear();completed.clear();$("search").value="";$("facilityCount").value="1";$("researchSpeed").value="1";renderAll();});
renderAll();
})();
</script>
